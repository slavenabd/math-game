<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button id="settings-btn">Settings</button>
    <div id="settings-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Game Settings</h2>
            
            <div class="setting-group">
                <label>Number Range:</label>
                <input type="number" id="min-val" value="0" min="0"> to 
                <input type="number" id="max-val" value="20" min="1">
            </div>
            
            <div class="setting-group">
                <label>Operations:</label>
                <div>
                    <input type="checkbox" id="op-add" checked> <label for="op-add">Addition (+)</label>
                </div>
                <div>
                    <input type="checkbox" id="op-sub"> <label for="op-sub">Subtraction (-)</label>
                </div>
                <div>
                    <input type="checkbox" id="op-mul"> <label for="op-mul">Multiplication (*)</label>
                </div>
                <div>
                    <input type="checkbox" id="op-div"> <label for="op-div">Division (/)</label>
                </div>
            </div>

            <button id="save-settings">Save & Restart</button>
        </div>
    </div>
    <div id="game-container">
        <div id="progress-bar"></div>
        <h1>Math Game</h1>
        <div id="instructions">Provide your answer by typing the numbers and hitting Enter. Use Backspace to correct.</div>
        <div id="question">15 + 7 = ?</div>
        <div id="typed-answer"></div>
        <div id="result"></div>
        <div id="score">Score: 0</div>
        <button id="start-over">Start Over</button>
        <button id="play-again" style="display: none;">Play New Game</button>
        <div id="where-to-improve" style="display: none;">
            <h2>Where to Improve</h2>
            <ul id="improvement-list"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
